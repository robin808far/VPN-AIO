name: VPN-AIO Ubuntu validation

on:
  push:
    branches: [main, release/v2.0.0, feature/core-webgui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Check shell syntax
        run: |
          for file in deploy.sh vpn-ui.sh build.sh build/core/build.sh; do
            bash -n "$file"
          done
          python3 -c 'import ast,pathlib; ast.parse(pathlib.Path("test_unit/finalmask-config-check.py").read_text()); ast.parse(pathlib.Path("test_unit/native-core-smoke.py").read_text())'
      - name: Check GUI model round trips
        run: node test_unit/export_test/core-webgui.test.js
      - name: Build pinned Xray and fetch geodata
        run: GEO_LEAN=1 bash build/core/build.sh amd64
      - name: Test panel integration
        env:
          CGO_ENABLED: '1'
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/corebundle/core
          VPNUI_LOG_FOLDER: ${{ runner.temp }}/vpn-aio-logs
        run: go test -timeout 10m ./...
      - name: Native Xray protocol integration
        run: python3 test_unit/native-core-smoke.py corebundle/core/amd64/xray
      - name: XDRIVE core configuration validation
        run: python3 test_unit/xdrive-config-check.py corebundle/core/amd64/xray
      - name: FinalMask core configuration validation
        run: python3 test_unit/finalmask-config-check.py corebundle/core/amd64/xray
      - name: AmneziaWG kernel 3.1 integration
        if: runner.os == 'Linux'
        env:
          VPN_AIO_KERNEL_TEST: '1'
        run: |
          if modinfo amneziawg >/dev/null 2>&1; then
            sudo -E go test -timeout 5m -v ./web/service -run 'TestAWGKernel(CapabilitiesRequire3xParameters|HandshakeAndPeerRemoval)$'
          else
            echo 'AmneziaWG kernel module is not installed on this hosted runner; kernel integration is exercised on the Ubuntu test server.'
          fi
      - name: Compile panel with sqlite support
        env:
          CGO_ENABLED: '1'
        run: go build -o build/out/VPN-AIO-check .
      # This is not a release build: the full static VPN daemon and geo bundles
      # are built by build.sh before an installable artifact is published.
