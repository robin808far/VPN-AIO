name: VPN-AIO Ubuntu validation

on:
  push:
    branches: [main, release/v2.0.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Check shell syntax
        run: |
          for file in deploy.sh vpn-ui.sh build.sh build/core/build.sh; do
            bash -n "$file"
          done
      - name: Build pinned Xray and fetch geodata
        run: GEO_LEAN=1 bash build/core/build.sh amd64
      - name: Test panel integration
        env:
          CGO_ENABLED: '1'
          XRAY_LOCATION_ASSET: ${{ github.workspace }}/corebundle/core
          VPNUI_LOG_FOLDER: ${{ runner.temp }}/vpn-aio-logs
        run: go test -timeout 10m ./...
      - name: Native Xray protocol integration
        run: python3 test_unit/native-core-smoke.py corebundle/core/amd64/xray
      - name: Compile panel with sqlite support
        env:
          CGO_ENABLED: '1'
        run: go build -o build/out/VPN-AIO-check .
      # This is not a release build: the full static VPN daemon and geo bundles
      # are built by build.sh before an installable artifact is published.
