name: VPN-AIO Ubuntu validation

on:
  push:
    branches: [release/v2.0.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Check shell syntax
        run: |
          for file in deploy.sh vpn-ui.sh build.sh build/core/build.sh; do
            bash -n "$file"
          done
      - name: Build pinned Xray
        working-directory: third_party/Xray-core
        run: |
          mkdir -p ../../corebundle/core/amd64
          CGO_ENABLED=0 go build -o ../../corebundle/core/amd64/xray ./main
      - name: Test panel integration
        env:
          CGO_ENABLED: '1'
        run: go test -timeout 10m ./config ./awgsrc ./xray ./sub ./web/service
      - name: Compile panel with sqlite support
        env:
          CGO_ENABLED: '1'
        run: go build -o build/out/VPN-AIO-check .
      # This is not a release build: the full static VPN daemon and geo bundles
      # are built by build.sh before an installable artifact is published.
