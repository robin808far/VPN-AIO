name: VPN-AIO release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish the release under (e.g. v5.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Compute build cache key
        id: cachekey
        run: echo "pins=$(git submodule status | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache Xray core, geo files and VPN daemon bundles
        uses: actions/cache@v4
        with:
          # build.sh skips the slow Docker/Alpine daemon build and reuses the pinned
          # Xray core when these are already populated; the geo files are still
          # re-checked upstream on every run (not-modified check), so they stay fresh.
          path: |
            backend/bin
            corebundle/core
          key: vpn-aio-build-${{ runner.os }}-${{ steps.cachekey.outputs.pins }}
          restore-keys: vpn-aio-build-${{ runner.os }}-
      - name: Install arm64 cross-compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Register qemu binfmt for arm64 containers
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install arm64
      - name: Build amd64 bundle
        run: bash build.sh --arch amd64
      - name: Build arm64 bundle
        env:
          CC: aarch64-linux-gnu-gcc
        run: bash build.sh --arch arm64
      - name: Collect artifacts and checksums
        run: |
          cd build/out
          sha256sum VPN-AIO-amd64 VPN-AIO-arm64 > SHA256SUMS
          ls -lh VPN-AIO-amd64 VPN-AIO-arm64 SHA256SUMS
      - name: Generate changelog
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          PREV="$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1)"
          {
            echo "## VPN-AIO ${TAG#v}"
            echo
            echo "### Changes"
            git log --no-decorate --format='- %s (%h)' "${PREV:+$PREV..}$TAG" || git log --no-decorate --format='- %s (%h)' "$TAG" -n 20
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            fi
          } > build/out/CHANGELOG.md
          cat build/out/CHANGELOG.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: build/out/CHANGELOG.md
          files: |
            build/out/VPN-AIO-amd64
            build/out/VPN-AIO-arm64
            build/out/SHA256SUMS
