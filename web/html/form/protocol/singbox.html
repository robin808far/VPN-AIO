{{define "form/singbox"}}
<!-- Shown when an inbound's CORE is sing-box (any protocol): the panel stores the
     raw sing-box inbound object as the settings JSON and runs it verbatim.
     Two views over the SAME draft: the graphical form (s-ui style, edits the
     parsed object field by field) and the raw JSON editor. Each edit of one
     view re-serializes into singboxDraft, so the other view follows. -->
<a-alert type="info" show-icon style="margin-bottom:12px">
    <template slot="message">
        {{ i18n "pages.inbounds.singboxUnmanaged" }}
        <a :href="basePath + 'panel/clients'">{{ i18n "pages.clients.title" }}</a>
    </template>
</a-alert>
<a-button v-if="singboxHasLimits()" style="margin-bottom:12px" @click="singboxClearLimits()">Clear unsupported inbound-level limits</a-button>
<a-tabs default-active-key="gui" size="small">
    <a-tab-pane key="gui" tab="Graphical">
        <a-form layout="vertical">
            <a-row :gutter="12">
                <a-col :xs="12" :md="6">
                    <a-form-item label="Type">
                        <a-input :value="singboxGet(['type'])" disabled></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="12" :md="6">
                    <a-form-item label="Tag">
                        <a-input :value="singboxGet(['tag'])" @change="e => singboxSet(['tag'], e.target.value)"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="12" :md="6">
                    <a-form-item label="Listen">
                        <a-input :value="singboxGet(['listen'])" placeholder="::"
                            @change="e => singboxSet(['listen'], e.target.value)"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="12" :md="6">
                    <a-form-item label="Port">
                        <a-input-number :value="singboxGet(['listen_port'])" :min="1" :max="65535"
                            style="width: 100%"
                            @change="v => singboxSet(['listen_port'], v)"></a-input-number>
                    </a-form-item>
                </a-col>
            </a-row>

            <!-- Listen Fields (shared across every sing-box inbound type): TCP Fast
                 Open, TCP Multi Path, keep-alive controls and UDP fragment/timeout.
                 Advanced, so collapsed by default; only written to JSON when the
                 operator sets a non-default value. -->
            <a-collapse style="margin-bottom:12px">
                <a-collapse-panel key="listen-advanced" header="Advanced listen options">
                    <a-row :gutter="12">
                        <a-col :xs="12" :md="6">
                            <a-form-item label="TCP Fast Open">
                                <a-switch :checked="singboxGet(['tcp_fast_open'], false)"
                                    @change="v => singboxSet(['tcp_fast_open'], v || undefined)"></a-switch>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="TCP Multi Path">
                                <a-switch :checked="singboxGet(['tcp_multi_path'], false)"
                                    @change="v => singboxSet(['tcp_multi_path'], v || undefined)"></a-switch>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="Disable TCP keep-alive">
                                <a-switch :checked="singboxGet(['disable_tcp_keep_alive'], false)"
                                    @change="v => singboxSet(['disable_tcp_keep_alive'], v || undefined)"></a-switch>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="UDP fragment">
                                <a-switch :checked="singboxGet(['udp_fragment'], false)"
                                    @change="v => singboxSet(['udp_fragment'], v || undefined)"></a-switch>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6" v-if="!singboxGet(['disable_tcp_keep_alive'], false)">
                            <a-form-item label="TCP keep-alive period">
                                <a-input :value="singboxGet(['tcp_keep_alive'], '')" placeholder="5m (default)"
                                    @change="e => singboxSet(['tcp_keep_alive'], e.target.value.trim() || undefined)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6" v-if="!singboxGet(['disable_tcp_keep_alive'], false)">
                            <a-form-item label="TCP keep-alive interval">
                                <a-input :value="singboxGet(['tcp_keep_alive_interval'], '')" placeholder="75s (default)"
                                    @change="e => singboxSet(['tcp_keep_alive_interval'], e.target.value.trim() || undefined)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="UDP NAT timeout">
                                <a-input :value="singboxGet(['udp_timeout'], '')" placeholder="5m (default)"
                                    @change="e => singboxSet(['udp_timeout'], e.target.value.trim() || undefined)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="Bind interface">
                                <a-input :value="singboxGet(['bind_interface'], '')"
                                    @change="e => singboxSet(['bind_interface'], e.target.value.trim() || undefined)"></a-input>
                            </a-form-item>
                        </a-col>
                    </a-row>
                </a-collapse-panel>
            </a-collapse>

            <!-- ===== per-protocol settings ===== -->
            <a-row v-if="singboxGet(['type']) === 'shadowtls'" :gutter="12">
                <a-col :xs="16" :md="16">
                    <a-form-item label="Handshake server">
                        <a-input :value="singboxGet(['handshake', 'server'])"
                            @change="e => singboxSet(['handshake', 'server'], e.target.value)"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="8" :md="8">
                    <a-form-item label="Handshake port">
                        <a-input-number :value="singboxGet(['handshake', 'server_port'], 443)" :min="1" :max="65535"
                            @change="v => singboxSet(['handshake', 'server_port'], v)"></a-input-number>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row v-if="singboxGet(['type']) === 'shadowtls'" :gutter="12">
                <a-col :span="24">
                    <a-form-item label="Detour target (optional)">
                        <a-select allow-clear :value="singboxDetourTarget()"
                            placeholder="None — handshake only"
                            @change="singboxSetDetourTarget">
                            <a-select-option v-for="target in singboxDetourTargets()"
                                :key="target.id" :value="target.tag">
                                [[ target.remark || target.tag ]] — [[ target.protocol ]]:[[ target.port ]]
                            </a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row v-if="singboxGet(['type']) === 'shadowtls'" :gutter="12">
                <a-col :xs="16" :md="8">
                    <a-form-item label="Managed-user version">
                        <a-select :value="singboxGet(['version'])" @change="v => singboxSet(['version'], v)">
                            <a-select-option :value="1" disabled>1 (unsupported)</a-select-option>
                            <a-select-option :value="2" disabled>2 (unsupported)</a-select-option>
                            <a-select-option :value="3">3</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
                <a-col :xs="12" :md="8" v-if="singboxGet(['version']) === 3">
                    <a-form-item label="Strict mode">
                        <a-switch :checked="singboxGet(['strict_mode'], false)"
                            @change="v => singboxSet(['strict_mode'], v || undefined)"></a-switch>
                    </a-form-item>
                </a-col>
                <a-col :xs="12" :md="8" v-if="singboxGet(['version']) === 3">
                    <a-form-item label="Wildcard SNI">
                        <a-select :value="singboxGet(['wildcard_sni'], 'off')"
                            @change="v => singboxSet(['wildcard_sni'], v === 'off' ? undefined : v)">
                            <a-select-option value="off">off</a-select-option>
                            <a-select-option value="authed">authed</a-select-option>
                            <a-select-option value="all">all</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
            </a-row>
            <template v-if="singboxGet(['type']) === 'vless' || singboxGet(['type']) === 'vmess'">
                <a-row :gutter="12">
                    <a-col :xs="12" :md="8">
                        <a-form-item label="Multiplex (mux)">
                            <a-switch :checked="singboxGet(['multiplex', 'enabled'], false)"
                                @change="v => singboxSet(['multiplex', 'enabled'], v)"></a-switch>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="8" v-if="singboxGet(['multiplex', 'enabled'], false)">
                        <a-form-item label="Padding">
                            <a-switch :checked="singboxGet(['multiplex', 'padding'], false)"
                                @change="v => singboxSet(['multiplex', 'padding'], v)"></a-switch>
                        </a-form-item>
                    </a-col>
                </a-row>
            </template>

            <template v-if="singboxGet(['type']) === 'shadowsocks'">
                <a-row :gutter="12">
                    <a-col :xs="12" :md="10">
                        <a-form-item label="Method">
                            <a-select :value="singboxGet(['method'])"
                                @change="v => singboxSet(['method'], v)">
                                <a-select-option value="2022-blake3-aes-128-gcm">2022-blake3-aes-128-gcm</a-select-option>
                                <a-select-option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</a-select-option>
                                <a-select-option value="2022-blake3-chacha20-poly1305">2022-blake3-chacha20-poly1305</a-select-option>
                                <a-select-option value="aes-128-gcm">aes-128-gcm</a-select-option>
                                <a-select-option value="aes-256-gcm">aes-256-gcm</a-select-option>
                                <a-select-option value="chacha20-ietf-poly1305">chacha20-ietf-poly1305</a-select-option>
                                <a-select-option value="none">none</a-select-option>
                            </a-select>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="14">
                        <a-form-item label="Password">
                            <a-input :value="singboxGet(['password'])"
                                @change="e => singboxSet(['password'], e.target.value)"></a-input>
                        </a-form-item>
                    </a-col>
                </a-row>
            </template>

            <!-- Snell (sing-box 1.14.0+): base psk + protocol version; v5 has HTTP
                 obfuscation (obfs_mode), v6 replaces it with traffic shaping (mode) and
                 needs a psk of 12-255 bytes. Per-user credentials ("userkey") are managed
                 the same way as every other sing-box protocol's users[] — see Clients. -->
            <template v-if="singboxGet(['type']) === 'snell'">
                <a-row :gutter="12">
                    <a-col :xs="12" :md="6">
                        <a-form-item label="Version">
                            <a-select :value="singboxGet(['version'], 5)"
                                @change="v => singboxSet(['version'], v)">
                                <a-select-option :value="5">5</a-select-option>
                                <a-select-option :value="6">6</a-select-option>
                            </a-select>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="18">
                        <a-form-item :label="singboxGet(['version'], 5) === 6 ? 'PSK (12-255 bytes)' : 'PSK'">
                            <a-input :value="singboxGet(['psk'])"
                                @change="e => singboxSet(['psk'], e.target.value)"></a-input>
                        </a-form-item>
                    </a-col>
                </a-row>
                <a-row :gutter="12" v-if="singboxGet(['version'], 5) === 5">
                    <a-col :xs="12" :md="8">
                        <a-form-item label="Obfs mode">
                            <a-select :value="singboxGet(['obfs_mode'], 'none')"
                                @change="v => singboxSet(['obfs_mode'], v === 'none' ? undefined : v)">
                                <a-select-option value="none">none</a-select-option>
                                <a-select-option value="http">http</a-select-option>
                            </a-select>
                        </a-form-item>
                    </a-col>
                </a-row>
                <a-row :gutter="12" v-if="singboxGet(['version'], 5) === 6">
                    <a-col :xs="12" :md="8">
                        <a-form-item label="Traffic shaping mode">
                            <a-select :value="singboxGet(['mode'], 'default')"
                                @change="v => singboxSet(['mode'], v === 'default' ? undefined : v)">
                                <a-select-option value="default">default</a-select-option>
                                <a-select-option value="unshaped">unshaped</a-select-option>
                                <a-select-option value="unsafe-raw">unsafe-raw</a-select-option>
                            </a-select>
                        </a-form-item>
                    </a-col>
                </a-row>
            </template>


            <template v-if="singboxGet(['type']) === 'hysteria2'">
                <a-row :gutter="12">
                    <a-col :xs="12" :md="6">
                        <a-form-item label="Ignore client bandwidth">
                            <a-switch :checked="singboxGet(['ignore_client_bandwidth'], false)"
                                @change="v => singboxSet(['ignore_client_bandwidth'], v)"></a-switch>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="6">
                        <a-form-item label="Up (Mbps)">
                            <a-input-number :value="singboxGet(['up_mbps'])" :min="0" style="width: 100%"
                                @change="v => singboxSet(['up_mbps'], v)"></a-input-number>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="6">
                        <a-form-item label="Down (Mbps)">
                            <a-input-number :value="singboxGet(['down_mbps'])" :min="0" style="width: 100%"
                                @change="v => singboxSet(['down_mbps'], v)"></a-input-number>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="6">
                        <a-form-item label="Obfs">
                            <a-select :value="singboxGet(['obfs', 'type'], '')"
                                @change="v => singboxSetObfs(v)">
                                <a-select-option value="">none</a-select-option>
                                <a-select-option value="salamander">salamander</a-select-option>
                                <a-select-option value="gecko">gecko (1.14+)</a-select-option>
                            </a-select>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="24" :md="12" v-if="singboxGet(['obfs', 'type'], '')">
                        <a-form-item label="Obfs password">
                            <a-input :value="singboxGet(['obfs', 'password'])"
                                @change="e => singboxSet(['obfs', 'password'], e.target.value)"></a-input>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="6" v-if="singboxGet(['obfs', 'type'], '') === 'gecko'">
                        <a-form-item label="Min packet size">
                            <a-input-number :value="singboxGet(['obfs', 'min_packet_size'], 512)" :min="1" :max="65535" style="width: 100%"
                                @change="v => singboxSet(['obfs', 'min_packet_size'], v || undefined)"></a-input-number>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="6" v-if="singboxGet(['obfs', 'type'], '') === 'gecko'">
                        <a-form-item label="Max packet size">
                            <a-input-number :value="singboxGet(['obfs', 'max_packet_size'], 1200)" :min="1" :max="65535" style="width: 100%"
                                @change="v => singboxSet(['obfs', 'max_packet_size'], v || undefined)"></a-input-number>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="6">
                        <a-form-item label="BBR profile">
                            <a-select :value="singboxGet(['bbr_profile'], '')"
                                @change="v => singboxSet(['bbr_profile'], v || undefined)">
                                <a-select-option value="">default (standard)</a-select-option>
                                <a-select-option value="conservative">conservative</a-select-option>
                                <a-select-option value="standard">standard</a-select-option>
                                <a-select-option value="aggressive">aggressive</a-select-option>
                            </a-select>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="24" :md="12">
                        <a-form-item label="Masquerade (on auth failure)">
                            <a-input :value="typeof singboxGet(['masquerade'], '') === 'string' ? singboxGet(['masquerade'], '') : ''"
                                :disabled="typeof singboxGet(['masquerade'], '') === 'object'"
                                placeholder="https://www.bing.com  or  file:///var/www  (empty = 404)"
                                @change="e => singboxSet(['masquerade'], e.target.value.trim() || undefined)"></a-input>
                        </a-form-item>
                    </a-col>
                </a-row>
            </template>

            <template v-if="singboxGet(['type']) === 'tuic'">
                <a-row :gutter="12">
                    <a-col :xs="12" :md="8">
                        <a-form-item label="Congestion control">
                            <a-select :value="singboxGet(['congestion_control'], 'cubic')"
                                @change="v => singboxSet(['congestion_control'], v)">
                                <a-select-option value="cubic">cubic</a-select-option>
                                <a-select-option value="new_reno">new_reno</a-select-option>
                                <a-select-option value="bbr">bbr</a-select-option>
                            </a-select>
                        </a-form-item>
                    </a-col>
                    <a-col :xs="12" :md="8">
                        <a-form-item label="Zero RTT handshake">
                            <a-switch :checked="singboxGet(['zero_rtt_handshake'], false)"
                                @change="v => singboxSet(['zero_rtt_handshake'], v)"></a-switch>
                        </a-form-item>
                    </a-col>
                </a-row>
            </template>

            <!-- ===== users ===== -->
            <div v-if="singboxUsesUsers()">
                <h4 class="bo-if-h" style="margin: 8px 0 4px;">Users</h4>
                <a-row v-for="(u, i) in singboxUsers()" :key="i" :gutter="12" align="middle">
                    <a-col :xs="8" :md="6">
                        <a-input :value="singboxUserGet(i, 'name')" placeholder="name"
                            @change="e => singboxUserSet(i, 'name', e.target.value)"></a-input>
                    </a-col>
                    <a-col :xs="16" :md="8" v-if="['vless', 'vmess', 'tuic'].includes(singboxGet(['type']))">
                        <a-input :value="singboxUserGet(i, 'uuid')" placeholder="uuid"
                            @change="e => singboxUserSet(i, 'uuid', e.target.value)"></a-input>
                    </a-col>
                    <a-col :xs="12" :md="5" v-if="singboxGet(['type']) === 'vless'">
                        <a-select :value="singboxUserGet(i, 'flow')" placeholder="flow"
                            @change="v => singboxUserSet(i, 'flow', v)">
                            <a-select-option value="">no flow</a-select-option>
                            <a-select-option value="xtls-rprx-vision">xtls-rprx-vision</a-select-option>
                        </a-select>
                    </a-col>
                    <a-col :xs="16" :md="10"
                        v-if="['trojan', 'anytls', 'shadowtls', 'hysteria2', 'tuic'].includes(singboxGet(['type']))">
                        <a-input :value="singboxUserGet(i, 'password')" placeholder="password"
                            @change="e => singboxUserSet(i, 'password', e.target.value)"></a-input>
                    </a-col>
                    <a-col :xs="8" :md="5">
                        <a-button type="danger" size="small" icon="delete"
                            @click="singboxRemoveUser(i)"></a-button>
                    </a-col>
                </a-row>
                <a-button size="small" icon="plus" style="margin-top: 8px"
                    @click="singboxAddUser()">Add user</a-button>
            </div>

            <!-- ===== transport ===== -->
            <div v-if="['vless', 'vmess', 'trojan'].includes(singboxGet(['type']))" style="margin-top: 12px;">
                <a-form-item label="Transport">
                    <a-switch :checked="singboxHas(['transport'])"
                        @change="v => singboxToggleBlock(['transport'], v, { type: 'ws', path: '/' })"></a-switch>
                </a-form-item>
                <template v-if="singboxHas(['transport'])">
                    <a-row :gutter="12">
                        <a-col :xs="12" :md="6">
                            <a-form-item label="Network">
                                <a-select :value="singboxGet(['transport', 'type'], 'ws')"
                                    @change="v => singboxSet(['transport'], v === 'grpc' ? { type: v, service_name: '' } : { type: v, path: '/' })">
                                    <a-select-option value="ws">ws</a-select-option>
                                    <a-select-option value="http">http</a-select-option>
                                    <a-select-option value="httpupgrade">httpupgrade</a-select-option>
                                    <a-select-option value="grpc">grpc</a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6" v-if="singboxGet(['transport', 'type']) !== 'grpc'">
                            <a-form-item label="Path">
                                <a-input :value="singboxGet(['transport', 'path'])" placeholder="/"
                                    @change="e => singboxSet(['transport', 'path'], e.target.value)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6" v-if="singboxGet(['transport', 'type']) === 'grpc'">
                            <a-form-item label="Service name">
                                <a-input :value="singboxGet(['transport', 'service_name'])"
                                    @change="e => singboxSet(['transport', 'service_name'], e.target.value)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6" v-if="singboxGet(['transport', 'type']) !== 'grpc'">
                            <a-form-item label="Host header">
                                <a-input :value="singboxHostHeader()"
                                    @change="e => singboxSetHostHeader(e.target.value)"></a-input>
                            </a-form-item>
                        </a-col>
                    </a-row>
                </template>
            </div>

            <!-- ===== tls ===== -->
            <div v-if="['vless', 'vmess', 'trojan', 'hysteria2', 'tuic', 'anytls'].includes(singboxGet(['type']))" style="margin-top: 12px;">
                <a-form-item label="TLS">
                    <a-switch :checked="singboxHas(['tls'])"
                        @change="v => singboxToggleBlock(['tls'], v, { enabled: true })"></a-switch>
                </a-form-item>
                <template v-if="singboxHas(['tls'])">
                    <a-row :gutter="12">
                        <a-col :span="24" v-if="sslCertChoices().length">
                            <a-form-item label='{{ i18n "pages.inbounds.useManagedCert" }}'>
                                <a-select :value="sslCertSelectedSingbox" allowClear
                                    :placeholder="'{{ i18n "none" }}'"
                                    @change="applyManagedCertSingbox">
                                    <a-select-option v-for="c in sslCertChoices()" :key="c.profile" :value="c.profile">
                                        [[ c.profile ]] — [[ c.domain || c.certPath ]]
                                    </a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="Enabled">
                                <a-switch :checked="singboxGet(['tls', 'enabled'], false)"
                                    @change="v => singboxSet(['tls', 'enabled'], v)"></a-switch>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="8">
                            <a-form-item label="SNI (server name)">
                                <a-input :value="singboxGet(['tls', 'server_name'])"
                                    @change="e => singboxSet(['tls', 'server_name'], e.target.value)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="10">
                            <a-form-item label="Certificate path">
                                <a-input :value="singboxGet(['tls', 'certificate_path'])" placeholder="/etc/ssl/fullchain.pem"
                                    @change="e => singboxSet(['tls', 'certificate_path'], e.target.value)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="10">
                            <a-form-item label="Key path">
                                <a-input :value="singboxGet(['tls', 'key_path'])" placeholder="/etc/ssl/privkey.pem"
                                    @change="e => singboxSet(['tls', 'key_path'], e.target.value)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :span="24">
                            <a-form-item label=" " :colon="false">
                                <a-button type="primary" icon="import" @click="singboxSetDefaultCert()">
                                    {{ i18n "pages.inbounds.setDefaultCert" }}</a-button>
                            </a-form-item>
                        </a-col>
                        <!-- Server-side TLS options (sing-box shared TLS, inbound). Each
                             one is written only when set, so an untouched form keeps
                             the stored JSON exactly as it was. -->
                        <a-col :xs="12" :md="6">
                            <a-form-item label="Min version">
                                <a-select :value="singboxGet(['tls', 'min_version'], '')" allowClear
                                    @change="v => singboxSet(['tls', 'min_version'], v || undefined)">
                                    <a-select-option v-for="v in ['1.0','1.1','1.2','1.3']" :key="v" :value="v">[[ v ]]</a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="Max version">
                                <a-select :value="singboxGet(['tls', 'max_version'], '')" allowClear
                                    @change="v => singboxSet(['tls', 'max_version'], v || undefined)">
                                    <a-select-option v-for="v in ['1.0','1.1','1.2','1.3']" :key="v" :value="v">[[ v ]]</a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="ALPN">
                                <a-select mode="tags" :value="singboxGet(['tls', 'alpn'], [])"
                                    @change="v => singboxSet(['tls', 'alpn'], v && v.length ? v : undefined)">
                                    <a-select-option v-for="v in ['h3','h2','http/1.1']" :key="v" :value="v">[[ v ]]</a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="Handshake timeout">
                                <a-input :value="singboxGet(['tls', 'handshake_timeout'], '')" placeholder="e.g. 15s"
                                    @change="e => singboxSet(['tls', 'handshake_timeout'], e.target.value.trim() || undefined)"></a-input>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="24" :md="12">
                            <a-form-item label="Curve preferences">
                                <a-select mode="multiple" :value="singboxGet(['tls', 'curve_preferences'], [])"
                                    placeholder="default (all)"
                                    @change="v => singboxSet(['tls', 'curve_preferences'], v && v.length ? v : undefined)">
                                    <a-select-option v-for="v in ['P256','P384','P521','X25519','X25519MLKEM768']" :key="v" :value="v">[[ v ]]</a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <!-- kTLS: Linux 5.1+ and TLS 1.3 only; TX only helps when splice(2)
                             applies and otherwise degrades performance (sing-box docs), so
                             both stay off unless the operator turns them on. -->
                        <a-col :xs="12" :md="6">
                            <a-form-item label="kTLS TX">
                                <a-switch :checked="singboxGet(['tls', 'kernel_tx'], false)"
                                    @change="v => singboxSet(['tls', 'kernel_tx'], v || undefined)"></a-switch>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="12" :md="6">
                            <a-form-item label="kTLS RX">
                                <a-switch :checked="singboxGet(['tls', 'kernel_rx'], false)"
                                    @change="v => singboxSet(['tls', 'kernel_rx'], v || undefined)"></a-switch>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="24" :md="12" v-if="!singboxHas(['tls', 'reality'])">
                            <a-form-item label="Client authentication (mTLS)">
                                <a-select :value="singboxGet(['tls', 'client_authentication'], 'no')"
                                    @change="v => singboxSet(['tls', 'client_authentication'], v === 'no' ? undefined : v)">
                                    <a-select-option v-for="v in ['no','request','require-any','verify-if-given','require-and-verify']" :key="v" :value="v">[[ v ]]</a-select-option>
                                </a-select>
                            </a-form-item>
                        </a-col>
                        <a-col :xs="24" :md="12"
                            v-if="['verify-if-given','require-and-verify'].includes(singboxGet(['tls', 'client_authentication'], 'no'))">
                            <a-form-item label="Client CA certificate path(s), comma separated">
                                <a-input :value="(singboxGet(['tls', 'client_certificate_path'], []) || []).join(',')"
                                    placeholder="/etc/ssl/client-ca.pem"
                                    @change="e => { const v = e.target.value.split(',').map(s => s.trim()).filter(Boolean); singboxSet(['tls', 'client_certificate_path'], v.length ? v : undefined); }"></a-input>
                            </a-form-item>
                        </a-col>
                    </a-row>
                    <a-form-item v-if="singboxGet(['type']) === 'vless'" label="REALITY">
                        <a-switch :checked="singboxHas(['tls', 'reality'])"
                            @change="v => singboxToggleBlock(['tls', 'reality'], v, { enabled: true, handshake: { server: '', server_port: 443 } })"></a-switch>
                    </a-form-item>
                    <template v-if="singboxHas(['tls', 'reality'])">
                        <a-row :gutter="12">
                            <a-col :xs="12" :md="8">
                                <a-form-item label="Handshake server">
                                    <a-input :value="singboxGet(['tls', 'reality', 'handshake', 'server'])" placeholder="www.microsoft.com"
                                        @change="e => singboxSet(['tls', 'reality', 'handshake', 'server'], e.target.value)"></a-input>
                                </a-form-item>
                            </a-col>
                            <a-col :xs="12" :md="4">
                                <a-form-item label="Handshake port">
                                    <a-input-number :value="singboxGet(['tls', 'reality', 'handshake', 'server_port'], 443)"
                                        :min="1" :max="65535" style="width: 100%"
                                        @change="v => singboxSet(['tls', 'reality', 'handshake', 'server_port'], v)"></a-input-number>
                                </a-form-item>
                            </a-col>
                            <a-col :xs="12" :md="6">
                                <a-form-item label="Private key">
                                    <a-input :value="singboxGet(['tls', 'reality', 'private_key'])"
                                        @change="e => singboxSet(['tls', 'reality', 'private_key'], e.target.value)"></a-input>
                                </a-form-item>
                            </a-col>
                            <a-col :xs="12" :md="6">
                                <a-form-item label="Short IDs (comma separated)">
                                    <a-input :value="singboxShortIds()"
                                        @change="e => singboxSetShortIds(e.target.value)"></a-input>
                                </a-form-item>
                            </a-col>
                        </a-row>
                    </template>
                </template>
            </div>
        </a-form>
    </a-tab-pane>
    <a-tab-pane key="json" tab="JSON">
        <a-form-item :validate-status="singboxJsonStatus.status" :help="singboxJsonStatus.help">
            <a-textarea
                :value="singboxJsonText()"
                @input="applySingboxJson($event.target.value)"
                :rows="16"
                class="code-editor"
            ></a-textarea>
        </a-form-item>
    </a-tab-pane>
</a-tabs>
{{end}}
