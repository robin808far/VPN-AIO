{{define "form/masque"}}
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item label="Server address and prefix">
    <a-select mode="tags" v-model="inbound.settings.address" :token-separators="[',', ' ']" placeholder="198.18.0.1/24"></a-select>
  </a-form-item>
  <a-form-item label="MTU">
    <a-input-number v-model.number="inbound.settings.mtu" :min="1280" :max="65535"></a-input-number>
  </a-form-item>
</a-form>
{{end}}
