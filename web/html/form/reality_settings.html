{{define "form/realitySettings"}}
<template>
    <a-form-item label='Show'>
        <a-switch v-model="inbound.stream.reality.show"></a-switch>
    </a-form-item>
    <a-form-item label='Xver'>
        <a-input-number v-model.number="inbound.stream.reality.xver" :min="0"></a-input-number>
    </a-form-item>
    <a-form-item label='uTLS'>
        <a-select v-model="inbound.stream.reality.settings.fingerprint" :style="{ width: '100%' }"
            :dropdown-class-name="themeSwitcher.currentTheme">
            <a-select-option v-for="key in UTLS_FINGERPRINT" :value="key">[[ key ]]</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template> Target <a-icon @click="randomizeRealityTarget()" type="sync"></a-icon>
            </a-tooltip>
        </template>
        <div style="margin-bottom:6px;">
            <a-button-group>
                <a-button @click="scanRealityTarget">
                    <a-icon type="scan"></a-icon> Scan
                </a-button>
                <a-button @click="openRealityFinder">
                    <a-icon type="search"></a-icon> Find Targets
                </a-button>
            </a-button-group>
        </div>
        <a-input v-model.trim="inbound.stream.reality.target"></a-input>
    </a-form-item>
    <a-form-item v-if="realityScanResult" :wrapper-col="{ span: 24 }">
        <a-alert :type="realityScanResult.feasible ? 'success' : 'error'" :message="realityScanTitleText">
            <template slot="description">
                <div v-if="realityScanResult.error" style="white-space: pre-wrap;">[[ realityScanResult.error ]]</div>
                <template v-else>
                    <div>SNI used: <b>[[ realityScanResult.sni || '—' ]]</b></div>
                    <div>TLS: <b>[[ realityScanResult.tlsVersion ]]</b></div>
                    <div>ALPN: <b>[[ realityScanResult.alpn || '—' ]]</b></div>
                    <div v-if="realityScanResult.keyExchange">Key Exchange: <b>[[ realityScanResult.keyExchange ]]</b></div>
                    <div v-if="realityScanResult.certificate">Certificate: <b>[[ realityScanResult.certificate ]]</b></div>
                    <div v-if="realityScanResult.certExpires">Certificate expires: <b>[[ realityScanResult.certExpires ]] UTC</b></div>
                    <div>Cert chain: <b>[[ realityScanResult.certChain ]] B</b></div>
                    <div>Latency: <b>[[ realityScanResult.latencyMs ]] ms</b></div>
                </template>
            </template>
        </a-alert>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template> SNI <a-icon @click="randomizeRealityTarget()" type="sync"></a-icon>
            </a-tooltip>
        </template>
        <a-input v-model.trim="inbound.stream.reality.serverNames"></a-input>
    </a-form-item>
    <a-form-item label='Max Time Diff (ms)'>
        <a-input-number v-model.number="inbound.stream.reality.maxTimediff" :min="0"></a-input-number>
    </a-form-item>
    <a-form-item label='Min Client Ver'>
        <a-input v-model.trim="inbound.stream.reality.minClientVer" placeholder='25.9.11'></a-input>
    </a-form-item>
    <a-form-item label='Max Client Ver'>
        <a-input v-model.trim="inbound.stream.reality.maxClientVer" placeholder='25.9.11'></a-input>
    </a-form-item>
    <a-form-item>
        <template slot="label">
            <a-tooltip>
                <template slot="title">
                    <span>{{ i18n "reset" }}</span>
                </template> Short IDs <a-icon @click="inbound.stream.reality.shortIds = RandomUtil.randomShortIds()"
                    type="sync"></a-icon>
            </a-tooltip>
        </template>
        <a-textarea v-model.trim="inbound.stream.reality.shortIds"></a-textarea>
    </a-form-item>
    <a-form-item label='SpiderX'>
        <a-input v-model.trim="inbound.stream.reality.settings.spiderX"></a-input>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.inbounds.publicKey" }}'>
        <a-textarea v-model="inbound.stream.reality.settings.publicKey"></a-textarea>
    </a-form-item>
    <a-form-item label='{{ i18n "pages.inbounds.privatekey" }}'>
        <a-textarea v-model="inbound.stream.reality.privateKey"></a-textarea>
    </a-form-item>
    <a-form-item label=" ">
        <a-space>
            <a-button type="primary" icon="import" @click="getNewX25519Cert">Get New Cert</a-button>
            <a-button danger @click="clearX25519Cert">Clear</a-button>
        </a-space>
    </a-form-item>
    <a-form-item label="mldsa65 Seed">
        <a-textarea v-model="inbound.stream.reality.mldsa65Seed"></a-textarea>
    </a-form-item>
    <a-form-item label="mldsa65 Verify">
        <a-textarea v-model="inbound.stream.reality.settings.mldsa65Verify"></a-textarea>
    </a-form-item>
    <a-form-item label=" ">
        <a-space>
            <a-button type="primary" icon="import" @click="getNewmldsa65">Get New Seed</a-button>
            <a-button danger @click="clearMldsa65">Clear</a-button>
        </a-space>
    </a-form-item>
    <a-modal v-model="realityFinderOpen" title="REALITY Target Scanner" :footer="null" :width="900"
        :dialog-style="{ top: '60px' }">
        <p style="margin-top:-8px;">Validate a domain, or scan an IP / CIDR range to discover new REALITY
            targets from their certificates. Leave the box empty to probe common candidates.</p>
        <a-input-search v-model="realityFinderQuery" placeholder="IP, CIDR, or domain — leave empty for common candidates"
            enter-button="Scan" @search="runRealityFinder" :disabled="realityFinderBusy"></a-input-search>
        <a-table :columns="realityFinderColumns" :data-source="realityFinderRows" :loading="realityFinderBusy"
            :pagination="{ pageSize: 10 }" row-key="target" size="small" style="margin-top:12px;">
            <template slot="status" slot-scope="text, record">
                <a-tag :color="record.feasible ? 'green' : 'red'">[[ record.feasible ? 'Feasible' : 'Unusable' ]]</a-tag>
            </template>
            <template slot="use" slot-scope="text, record">
                <a v-if="record.feasible" @click="useRealityFinderRow(record)">Use</a>
            </template>
        </a-table>
        <div style="text-align:right; margin-top:8px;">
            <a-button type="primary" @click="runRealityFinder" :loading="realityFinderBusy">Rescan</a-button>
        </div>
    </a-modal>
</template>
{{end}}
